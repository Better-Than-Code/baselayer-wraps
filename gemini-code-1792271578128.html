<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BaseLayer Wraps // Jacksonville Launch</title>
  <style>
    :root {
      --bg-dark: #0b0f17;
      --card-bg: #131b26;
      --border-color: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-cyan: #38bdf8;
      --accent-gold: #f59e0b;
      --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-stack);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
    }

    /* Trigger Button */
    .btn-founder-wall {
      width: 100%;
      padding: 14px 20px;
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      color: #f8fafc;
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
      transition: all 0.2s ease;
    }

    .btn-founder-wall:hover {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
      transform: translateY(-1px);
    }

    /* Modal Architecture */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(3, 7, 18, 0.85);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      z-index: 1000;
      padding: 16px;
    }

    .modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .wall-modal-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      width: 100%;
      max-width: 480px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
      outline: none;
      overflow: hidden;
    }

    .modal-header {
      padding: 18px 20px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(15, 23, 42, 0.6);
    }

    .modal-title {
      font-size: 0.9rem;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text-main);
    }

    .btn-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.5rem;
      line-height: 1;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 4px;
      transition: color 0.15s;
    }

    .btn-close:hover {
      color: #fff;
    }

    .modal-body {
      padding: 20px;
      overflow-y: auto;
      overscroll-behavior: contain;
    }

    /* Section Subheaders */
    .tier-group-title {
      font-size: 0.75rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .tier-group-title.cyan {
      color: var(--accent-cyan);
    }

    .tier-group-title.gold {
      color: var(--accent-gold);
    }

    .tier-section {
      margin-bottom: 24px;
    }

    .tier-section.pinned {
      border-bottom: 1px solid rgba(56, 189, 248, 0.2);
      padding-bottom: 18px;
    }

    /* Backer Card */
    .wall-backer-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border-color);
      margin-bottom: 8px;
      transition: background 0.15s ease;
    }

    .wall-backer-card:hover {
      background: rgba(255, 255, 255, 0.04);
    }

    .backer-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .backer-avatar {
      width: 34px;
      height: 34px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 0.85rem;
      flex-shrink: 0;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: #1e293b;
      color: #fff;
    }

    .backer-info {
      min-width: 0;
    }

    .backer-name {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .backer-tier-tag {
      font-size: 0.7rem;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Hardened Skeuomorphic Badges */
    .backer-badge-pill {
      font-size: 0.7rem;
      font-weight: 900;
      padding: 5px 10px;
      border-radius: 5px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      box-shadow: 
        inset 0 1px 1px rgba(255, 255, 255, 0.4),
        inset 0 -2px 3px rgba(0, 0, 0, 0.3),
        0 2px 4px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.2);
      text-shadow: 0 1px 1px rgba(0, 0, 0, 0.6);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .badge-rider {
      background: linear-gradient(145deg, #475569 0%, #1e293b 100%);
      border-color: #38bdf8;
      color: #e0f2fe;
      box-shadow: 
        inset 0 1px 1px rgba(255, 255, 255, 0.4),
        0 0 10px rgba(56, 189, 248, 0.35);
    }

    .badge-diamond {
      background: linear-gradient(145deg, #1e1b4b 0%, #0f172a 100%);
      border-color: #c084fc;
      color: #f3e8ff;
    }

    .badge-gold {
      background: linear-gradient(145deg, #78350f 0%, #451a03 100%);
      border-color: #f59e0b;
      color: #fef3c7;
    }

    .badge-silver {
      background: linear-gradient(145deg, #64748b 0%, #334155 100%);
      border-color: #cbd5e1;
      color: #f8fafc;
    }

    .badge-bronze {
      background: linear-gradient(145deg, #451a03 0%, #1c1917 100%);
      border-color: #d97706;
      color: #ffedd5;
    }

    /* Skeleton Placeholder */
    .skeleton-text {
      height: 12px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 4px;
      margin: 8px 0;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.6; }
      50% { opacity: 0.2; }
      100% { opacity: 0.6; }
    }
  </style>
</head>
<body>

  <div class="container">
    <button class="btn-founder-wall" onclick="openFounderWallModal()">
      <span>✦ View Founder Wall & Waitlist</span>
    </button>
  </div>

  <!-- A11y Accessible Modal -->
  <div id="founderWallModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-hidden="true">
    <div class="wall-modal-card" tabindex="-1">
      <div class="modal-header">
        <div id="modalTitle" class="modal-title">Official Founder Wall</div>
        <button class="btn-close" onclick="closeFounderWallModal()" aria-label="Close modal">&times;</button>
      </div>
      <div id="wallBackersList" class="modal-body">
        <!-- Injected via safe DOM renderer -->
      </div>
    </div>
  </div>

  <script>
    // Live In-Memory Cache (Populated from Google Sheets API)
    var WALL_DATA = [
      { name: "Marcus V.", amount: 25, type: "Rider Elite", color: "badge-rider", initial: "M" },
      { name: "Devon K.", amount: 100, type: "Diamond VIP", color: "badge-diamond", initial: "D" },
      { name: "Jax Beach Cruiser", amount: 50, type: "Gold Founder", color: "badge-gold", initial: "J" },
      { name: "Elena R.", amount: 10, type: "Bronze Founder", color: "badge-bronze", initial: "E" }
    ];

    // Strict Badge Class Whitelist preventing CSS / Class Injection
    var ALLOWED_CLASSES = {
      "badge-rider": true,
      "badge-diamond": true,
      "badge-gold": true,
      "badge-silver": true,
      "badge-bronze": true
    };

    function escapeHtml(unsafe) {
      if (typeof unsafe !== 'string') return '';
      return unsafe
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function sanitizeClass(className) {
      return ALLOWED_CLASSES[className] ? className : 'badge-bronze';
    }

    function renderBackerCard(f, isPinned) {
      var safeName = escapeHtml(f.name || 'Anonymous');
      var safeType = escapeHtml(f.type || 'Backer');
      var safeInitial = escapeHtml(f.initial || safeName.charAt(0).toUpperCase() || 'B');
      var safeAmount = parseInt(f.amount, 10) || 0;
      var safeColorClass = sanitizeClass(f.color);
      var extraCardStyle = isPinned 
        ? 'border-color: rgba(56, 189, 248, 0.4); background: rgba(56, 189, 248, 0.03);' 
        : '';

      return '<div class="wall-backer-card" style="' + extraCardStyle + '">' +
               '<div class="backer-left">' +
                 '<div class="backer-avatar">' + safeInitial + '</div>' +
                 '<div class="backer-info">' +
                   '<div class="backer-name">' + safeName + '</div>' +
                   '<div class="backer-tier-tag">' + safeType + '</div>' +
                 '</div>' +
               '</div>' +
               '<span class="backer-badge-pill ' + safeColorClass + '">$' + safeAmount + '</span>' +
             '</div>';
    }

    function openFounderWallModal() {
      var container = document.getElementById('wallBackersList');
      var htmlStr = '';

      if (!WALL_DATA || WALL_DATA.length === 0) {
        htmlStr = '<div style="text-align:center; color:var(--text-muted); padding:30px; font-size:0.85rem; font-weight:700;">' +
                    'No verified backers on the wall yet.<br>Claim the #1 spot.' +
                  '</div>';
      } else {
        var riderElites = [];
        var communityFounders = [];

        for (var i = 0; i < WALL_DATA.length; i++) {
          var item = WALL_DATA[i];
          if (item.type && item.type.toUpperCase().indexOf('RIDER') > -1) {
            riderElites.push(item);
          } else {
            communityFounders.push(item);
          }
        }

        communityFounders.sort(function(a, b) {
          return (parseInt(b.amount, 10) || 0) - (parseInt(a.amount, 10) || 0);
        });

        // 1. Pinned Priority Queue
        if (riderElites.length > 0) {
          htmlStr += '<div class="tier-section pinned">';
          htmlStr += '<div class="tier-group-title cyan">✦ Rider Elite Installation Queue ✦</div>';
          for (var j = 0; j < riderElites.length; j++) {
            htmlStr += renderBackerCard(riderElites[j], true);
          }
          htmlStr += '</div>';
        }

        // 2. Ranked Community Founders
        if (communityFounders.length > 0) {
          htmlStr += '<div class="tier-section">';
          htmlStr += '<div class="tier-group-title gold">✦ Community Founders ✦</div>';
          for (var k = 0; k < communityFounders.length; k++) {
            htmlStr += renderBackerCard(communityFounders[k], false);
          }
          htmlStr += '</div>';
        }
      }

      container.innerHTML = htmlStr;

      var modal = document.getElementById('founderWallModal');
      modal.classList.add('open');
      modal.setAttribute('aria-hidden', 'false');
      modal.querySelector('.wall-modal-card').focus();
      document.addEventListener('keydown', handleTrapFocus);
    }

    function closeFounderWallModal() {
      var modal = document.getElementById('founderWallModal');
      modal.classList.remove('open');
      modal.setAttribute('aria-hidden', 'true');
      document.removeEventListener('keydown', handleTrapFocus);
    }

    function handleTrapFocus(e) {
      if (e.key === 'Escape') {
        closeFounderWallModal();
        return;
      }
      if (e.key === 'Tab') {
        var modal = document.getElementById('founderWallModal');
        var focusable = modal.querySelectorAll('button, [tabindex="0"]');
        if (focusable.length === 0) return;
        var first = focusable[0];
        var last = focusable[focusable.length - 1];

        if (e.shiftKey && document.activeElement === first) {
          last.focus();
          e.preventDefault();
        } else if (!e.shiftKey && document.activeElement === last) {
          first.focus();
          e.preventDefault();
        }
      }
    }

    // Backdrop click-to-close
    document.getElementById('founderWallModal').addEventListener('click', function(e) {
      if (e.target === this) {
        closeFounderWallModal();
      }
    });
  </script>
</body>
</html>
